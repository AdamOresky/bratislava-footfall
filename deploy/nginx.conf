# nginx site. On the server: /etc/nginx/sites-available/chodci
# This is the version before certbot: `certbot --nginx` then adds the HTTPS lines itself.
server {
    listen 80;
    server_name chodci.oresky.sk;
    root /home/chodci/www;

    # API: the trailing slash in proxy_pass strips the /api prefix
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS/CSS have a hash in the name, so the browser may keep them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React routes (/sensor/11) are not files on disk: serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
