# nginx site for the test environment. On the server: /etc/nginx/sites-available/chodci-test
# Same as nginx.conf, with the test directory, port 8001 and a noindex header.
# An add_header inside a location replaces all add_header lines from server {}, so X-Robots-Tag
# has to be repeated in every location.
server {
    listen 80;
    server_name test.chodci.oresky.sk;
    root /home/chodci/www-test;

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
